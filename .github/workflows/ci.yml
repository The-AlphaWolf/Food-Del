name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fooddel
          POSTGRES_PASSWORD: fooddel
          POSTGRES_DB: fooddel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fooddel:fooddel@localhost:5432/fooddel_test
      DATABASE_URL: postgres://fooddel:fooddel@localhost:5432/fooddel_test
      AUTH_MODE: dev
      AUTH_DEV_SECRET: ci-only-secret-not-for-production-0000
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright, phone + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fooddel
          POSTGRES_PASSWORD: fooddel
          POSTGRES_DB: fooddel
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fooddel:fooddel@localhost:5432/fooddel
      APP_URL: http://localhost:3000
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      AUTH_DEV_SECRET: ci-only-secret-not-for-production-0000
      # The production server runs with the fake gateway, fake courier and dev endpoints.
      ALLOW_DEMO_MODE: "1"
      DEV_TOOLS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset
      - run: pnpm --filter @food-del/web build
      - run: pnpm --filter @food-del/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
